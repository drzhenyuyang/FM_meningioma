[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-mask-radiomics-extractor"
version = "1.0.0"
description = "Custom 90/447-feature mask-based MRI descriptor extraction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "nibabel>=5.1",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
extract-custom-radiomics = "radiomics_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
