[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strict-oof-multimodal-mlp"
version = "1.0.0"
description = "Training-only five-fold out-of-fold selection for multimodal binary MLP models."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
strict-oof-mlp = "strict_oof_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
